# This is a Declarative Automation Bundle definition for oreilly-mlops-with-databricks.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: oreilly-mlops-with-databricks

artifacts:
  default:
    type: whl
    build: uv build
    path: .

variables:
  git_sha:
    description: git_sha
    default: abcd
  branch:
    description: branch
    default: main
  schedule_pause_status:
    description: schedule pause status
    default: PAUSED
  # matches project_config.yml
  usage_policy_id:
    description: usage/budget policy id for cost attribution
    default: 733bae2f-cfac-47f7-8d52-ae2c091b1a5b

sync:
  include:
    - dist/*

include:
  - resources/*

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-f59c7869-7c54.cloud.databricks.com/
      root_path: "/Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}"

  acc:
    workspace:
      host: https://dbc-f59c7869-7c54.cloud.databricks.com/
      root_path: "/Shared/.bundle/${bundle.target}/${bundle.name}"
    variables:
      schedule_pause_status: PAUSED

  prd:
    workspace:
      host: https://dbc-f59c7869-7c54.cloud.databricks.com/
      root_path: "/Shared/.bundle/${bundle.target}/${bundle.name}"
    variables:
      schedule_pause_status: UNPAUSED
