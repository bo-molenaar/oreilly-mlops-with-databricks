resources:
  jobs:
    hotel-booking-monitor-update:
      name: hotel-booking-monitor-update-workflow
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: "Europe/Amsterdam"
        pause_status: "${var.schedule_pause_status}"
      tags:
        project: "hotel-booking"

      environments:
        - environment_key: "serverless"
          spec:
            client: "1"
            dependencies:
              - whl: ../dist/*.whl

      tasks:
        - task_key: "refresh_monitor_table"
          environment_key: "serverless"
          spark_python_task:
            python_file: "../scripts/refresh_monitor.py"
            parameters:
              - "common"
              - "--root_path"
              - "${workspace.root_path}"
              - "--env"
              - "${bundle.target}"
